{% extends "landing_base.html" %}
{% block title %} Reset Password {% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <h1>Set a New Password</h1>

        <form class="auth-form" method="POST"
              action="{{ url_for('reset_password', token=token) }}" novalidate>
            <div class="form-field">
                <label for="new-password">New password</label>
                <input type="password" id="new-password" name="new-password"
                       class="{{ 'has-error' if errors.password }}"
                       autocomplete="new-password" required>
                <small class="field-hint">At least 8 characters.</small>
                {% if errors.password %}<p class="field-error">{{ errors.password }}</p>{% endif %}
            </div>

            <div class="form-field">
                <label for="confirm-password">Confirm new password</label>
                <input type="password" id="confirm-password" name="confirm-password"
                       class="{{ 'has-error' if errors.confirm }}"
                       autocomplete="new-password" required>
                {% if errors.confirm %}<p class="field-error">{{ errors.confirm }}</p>{% endif %}
            </div>

            <button type="submit" class="btn-submit">Update password</button>
        </form>
    </div>
</section>
{% endblock %}
