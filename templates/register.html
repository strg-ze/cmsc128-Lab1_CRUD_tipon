{%extends "landing_base.html" %}
{% block title %} Sign Up {%endblock%}
{%block content%}

<section class="auth-page">
    <div class="auth-card">
        <h1> Create Account</h1>

        <form class="auth-form" method="POST" action="{{ url_for('register')}}" novalidate>
            <div class="form-field">
                <label for="display-name">Display name</label>
                <input type="text" id="display-name" name="display-name"
                    value=""
                    class=""
                    autocomplete="name" required>
                    <!--error msg here-->
            </div>

            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                    autocomplete="email" required>
                    <!--error msg here-->
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                    autocomplete="new-password" required>
                <small class="field-hont">At least 8 characters.</small>
                    <!--error msg here-->
            </div>

            <div class="form-field">
                <label for="confirm-password">Confirm password</label>
                <input type="confirm-password" id="confirm-password" name="confirm-password"
                    autocomplete="new-password" required>
                    <!--error msg here-->
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <p class="auth-alt">Already have an account? <a href="{{url_for('login')}}">Log In</a></p>
    </div>

</section>

{%endblock%}
